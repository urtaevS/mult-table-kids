name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web build into Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/. android/app/src/main/assets/public/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          SDK_CMD="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDK_CMD" ] || SDK_CMD="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          yes | "$SDK_CMD" --licenses >/dev/null
          "$SDK_CMD" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$EXIT" >> "$GITHUB_ENV"
          exit $EXIT

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Surface Gradle error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/gradle.log', 'utf8'); } catch (e) { log = 'Gradle log not found: ' + e.message; }
            const lines = log.split('\n');
            const tail = lines.slice(-150).join('\n');
            const body = '### ❌ Gradle `assembleDebug` failed (exit ' + process.env.GRADLE_EXIT + ')\n\n```\n' + tail + '\n```';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
