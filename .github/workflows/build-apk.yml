name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          APP_VERSION: ${{ env.VERSION_NAME || '' }}

      - name: Copy web build into Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/. android/app/src/main/assets/public/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDK_CMD="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDK_CMD" ] || SDK_CMD="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          yes | "$SDK_CMD" --licenses >/dev/null
          "$SDK_CMD" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # v1.0.3 -> 1.0.3 ; code = major*10000 + minor*100 + patch (monotonic)
          VER="${TAG#v}"
          IFS='.' read -r MA MI PA <<< "$VER"
          CODE=$(( ${MA:-0}*10000 + ${MI:-0}*100 + ${PA:-0} ))
          [ "$CODE" -eq 0 ] && CODE=4
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Derived $VER -> code $CODE"

      - name: Build Debug APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME"; java -version
          ./gradlew assembleDebug -PversionCode=${VERSION_CODE:-4} -PversionName=${VERSION_NAME:-1.0.3} --no-daemon 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$EXIT" >> "$GITHUB_ENV"
          exit $EXIT

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            LOG=$(git log --pretty=format:'- %s' --no-merges | head -30)
          else
            LOG=$(git log --pretty=format:'- %s' --no-merges "$PREV"..HEAD | head -40)
          fi
          {
            echo "## Что нового"
            echo ""
            echo "$LOG" | sed 's/^/- /' | sed 's/^- - /- /' | sed 's/^-- /- /'
            echo ""
            echo "### Скачать"
            echo "- **Android APK:** \`app-debug.apk\` ниже — установка поверх `v1.0.4+` сохраняет прогресс"
            echo "- **Web/PWA:** https://urtaevs.github.io/mult-table-kids/"
            echo ""
            echo "> Не удаляй приложение перед обновлением — только «Обновить» поверх."
          } > /tmp/notes.md
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/notes.md

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Surface Gradle error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/gradle.log', 'utf8'); } catch (e) { log = 'Gradle log not found: ' + e.message; }
            const lines = log.split('\n');
            const tail = lines.slice(-150).join('\n');
            const body = '### ❌ Gradle `assembleDebug` failed (exit ' + process.env.GRADLE_EXIT + ')\n\n```\n' + tail + '\n```';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
